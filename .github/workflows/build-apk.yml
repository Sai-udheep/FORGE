name: Build FORGE Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Project Scaffolding
        working-directory: android_app
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android wrapper scaffolding..."
            flutter create --org com.forge.execution --project-name forge_app .
          fi

      - name: Install Flutter Dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: android_app
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-2.0-Release-APK
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
